<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}personal website of debarka kundu{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title"
    content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta property="og:description"
    content="{{ with .Description }}{{ . }}{{ else }}personal website of debarka kundu{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="/style.css?v={{ now.Unix }}">
<script>
    (function () {
        try {
            const setting = localStorage.getItem('theme-setting') || 'auto';
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = setting === 'auto' ? (systemDark ? 'dark' : 'light') : setting;
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-theme-setting', setting);
        } catch (e) {}
    })();
</script>
<script src="/theme.js" defer></script>
